<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMAOSHI｜推しは、馬でいい。</title>
<meta name="description" content="UMAOSHI — 馬を応援する人と、馬を育てる人をつなぐコミュニティデモ。">
<style>
  :root{
    --turf:#1B3A2D; --turf-2:#2E6B4F; --turf-3:#4C8A55;
    --tint:#EAF2EC; --tint-2:#F4F8F5; --paper:#FCFCFA;
    --saddle:#8A5A2B; --saddle-2:#A96F38; --gold:#C9A227;
    --ink:#1F2A24; --mute:#6B7770; --line:#E1E8E3; --live:#B8433A;
    --sheet-r:22px;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 20% 0%,#25503E 0%,#1B3A2D 45%,#122A20 100%);
    color:var(--ink);font-feature-settings:"palt";
    display:grid;grid-template-columns:320px 1fr;min-height:100vh;overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  input,textarea{font:inherit}

  /* ---------- presenter panel ---------- */
  .panel{color:#E6EFE9;padding:28px 24px;display:flex;flex-direction:column;gap:18px;border-right:1px solid rgba(255,255,255,.08);overflow:auto}
  .panel .brand{display:flex;align-items:center;gap:12px}
  .panel .brand svg{width:34px;height:34px}
  .panel .brand b{font-size:20px;letter-spacing:.14em}
  .panel .brand small{display:block;font-size:11px;color:#9FB8AA;letter-spacing:0}
  .panel h2{font-size:12px;font-weight:600;color:#9FB8AA;margin-top:6px}
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;padding:9px 10px;border-radius:12px;color:#E6EFE9;transition:background .15s}
  .step:hover{background:rgba(255,255,255,.07)}
  .step.on{background:rgba(201,162,39,.16)}
  .step .n{width:26px;height:26px;border-radius:50%;background:#2E6B4F;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
  .step.on .n{background:var(--gold);color:var(--turf)}
  .step b{display:block;font-size:13px;font-weight:600}
  .step span{display:block;font-size:11.5px;color:#B8CCC0;margin-top:2px;line-height:1.4}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
  .seg button{padding:9px 6px;border-radius:9px;font-size:13px;color:#C9D9CF}
  .seg button.on{background:#E6EFE9;color:var(--turf);font-weight:700}
  .panel .tools{display:flex;gap:8px}
  .panel .tools button{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.18);font-size:12.5px;color:#E6EFE9}
  .panel .tools button:hover{background:rgba(255,255,255,.08)}
  .panel .note{font-size:11.5px;color:#9FB8AA;line-height:1.55;margin-top:auto}

  /* ---------- stage + phone ---------- */
  .stage{display:grid;place-items:center;padding:20px;overflow:hidden}
  .phone{width:390px;height:844px;background:#0D0F0E;border-radius:52px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 1.5px #3A3F3C;position:relative;transform-origin:center;flex:none}
  .screen{position:relative;width:100%;height:100%;background:var(--paper);border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
  .statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .statusbar .isl{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0D0F0E}
  .statusbar .sig{display:flex;gap:5px;align-items:center;font-size:12px}
  .app{flex:1;overflow:auto;scrollbar-width:none;position:relative}
  .app::-webkit-scrollbar{display:none}
  .tabbar{height:78px;flex:none;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 14px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10.5px;font-weight:600;border-radius:12px}
  .tab svg{width:24px;height:24px}
  .tab.on{color:var(--turf)}
  .tab.on svg{color:var(--turf)}

  /* ---------- shared ---------- */
  .wrap{padding:0 20px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 6px}
  .logo{font-weight:800;letter-spacing:.14em;font-size:17px;color:var(--turf)}
  .logo small{display:block;font-size:10px;letter-spacing:.02em;color:var(--mute);font-weight:600}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--turf)}
  .icon-btn:hover{background:var(--tint)}
  .icon-btn svg{width:22px;height:22px}
  h1.page{font-size:24px;font-weight:800;letter-spacing:.01em;padding:8px 20px 4px}
  p.lead{color:var(--mute);font-size:13px;padding:0 20px 10px;line-height:1.5}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--tint);color:var(--turf-2);white-space:nowrap}
  .chip.gold{background:#F7EFD2;color:#7A5E0F}
  .chip.brown{background:#F1E6DA;color:var(--saddle)}
  .chip.live{background:var(--live);color:#fff}
  .chip.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:14px;font-weight:700;font-size:14.5px;transition:transform .08s,filter .15s;line-height:1.1}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--turf);color:#fff}
  .btn.brown{background:var(--saddle);color:#fff}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--turf)}
  .btn.soft{background:var(--tint);color:var(--turf)}
  .btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
  .btn.block{width:100%}
  .btn svg{width:18px;height:18px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .num{font-variant-numeric:tabular-nums}
  .mute{color:var(--mute)}
  .sec{padding:18px 20px 0}
  .sec h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between}
  .sec h3 a{font-size:12px;color:var(--turf-2);font-weight:600;cursor:pointer}
  .divider{height:8px;background:var(--tint-2);margin-top:18px}
  .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
  .avatar svg{width:60%;height:60%}
  .avatar.ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--live)}
  .avatar.ring-gold::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--gold)}

  /* scene image */
  .scene{display:block;width:100%;height:100%}
  .media{position:relative;overflow:hidden;background:var(--tint)}
  .media .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:rgba(27,58,45,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;padding:20px}
  .media .lock b{font-size:14px}
  .media .lock span{font-size:12px;opacity:.9}
  .media .badge{position:absolute;left:12px;top:12px}
  .media .live-cam{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px}

  /* ---------- home ---------- */
  .oshi-strip{display:flex;gap:14px;padding:6px 20px 14px;overflow-x:auto;scrollbar-width:none}
  .oshi-strip::-webkit-scrollbar{display:none}
  .oshi-strip button{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:62px}
  .oshi-strip .avatar{width:56px;height:56px}
  .oshi-strip span{font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
  .oshi-strip .add .avatar{background:#fff;border:1.5px dashed #B9C8BE;color:var(--mute)}
  .post{border-top:8px solid var(--tint-2);}
  .post .head{display:flex;align-items:center;gap:10px;padding:12px 20px 10px}
  .post .head b{font-size:14.5px}
  .post .head small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
  .post .media{aspect-ratio:4/3}
  .post .body{padding:12px 20px 4px;font-size:14.5px;line-height:1.6}
  .post .acts{display:flex;align-items:center;gap:4px;padding:6px 14px 14px}
  .act{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mute)}
  .act:hover{background:var(--tint-2)}
  .act svg{width:20px;height:20px}
  .act.liked{color:var(--live)}
  .act.gift{color:var(--saddle)}
  .act .sp{flex:1}

  /* ---------- horse page ---------- */
  .hero{position:relative;height:300px;background:var(--tint)}
  .hero .back{position:absolute;left:12px;top:8px;background:rgba(255,255,255,.9);color:var(--turf);z-index:2}
  .hero .heart{position:absolute;right:12px;top:8px;background:rgba(255,255,255,.9);z-index:2}
  .hero .heart.on{color:var(--live)}
  .hero .grad{position:absolute;inset:auto 0 0 0;height:150px;background:linear-gradient(to top,rgba(252,252,250,1) 18%,rgba(252,252,250,0))}
  .hero .title{position:absolute;left:20px;right:20px;bottom:10px;z-index:2}
  .hero .title h1{font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1.1}
  .hero .title .sub{font-size:13px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);padding:8px 20px 0}
  .stats div{padding:8px 0}
  .stats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .stats span{font-size:11.5px;color:var(--mute)}
  .cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 20px 0}
  .support{margin:0 20px;background:var(--tint);border-radius:18px;padding:16px}
  .support .goal{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--mute)}
  .support .goal b{font-size:22px;color:var(--turf);font-weight:800}
  .bar{height:10px;border-radius:6px;background:#fff;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;background:var(--turf-2);border-radius:6px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .support .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
  .usage{margin-top:12px}
  .stack{display:flex;height:14px;border-radius:7px;overflow:hidden}
  .stack i{display:block;height:100%}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:1px}
  .legend span{float:right;color:var(--mute)}
  .story{position:relative;padding-left:20px}
  .story::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .story .it{position:relative;padding:0 0 14px}
  .story .it::before{content:"";position:absolute;left:-19.5px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--turf-2);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--turf-2)}
  .story .it.future::before{background:#fff;box-shadow:0 0 0 1.5px var(--gold)}
  .story .it small{display:block;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .story .it b{font-size:14px;font-weight:700}
  .story .it.future b{color:#7A5E0F}
  .event{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
  .event:first-child{border-top:0}
  .event .d{background:var(--turf);color:#fff;border-radius:12px;text-align:center;padding:6px 0}
  .event .d b{display:block;font-size:20px;line-height:1.05}
  .event .d span{font-size:10.5px;opacity:.85}
  .event h4{font-size:14.5px;font-weight:700}
  .event p{font-size:12.5px;color:var(--mute);margin-top:2px}
  .event .ebtn{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .ped{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ped div{background:var(--tint-2);border-radius:12px;padding:10px 12px}
  .ped small{display:block;font-size:11px;color:var(--mute)}
  .ped b{font-size:14px}
  .ped .kids{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:none;padding:0}
  .ped .kids .chip{cursor:pointer}
  .ledger .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .ledger .li:first-child{border-top:0}
  .ledger .li .who{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--turf);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .ledger .li b{font-weight:700}
  .ledger .li small{display:block;color:var(--mute);font-size:11.5px}
  .ledger .li .amt{margin-left:auto;font-weight:800;color:var(--turf);white-space:nowrap}
  .ledger .li.exp .who{background:#F1E6DA;color:var(--saddle)}
  .ledger .li.exp .amt{color:var(--saddle)}

  /* ---------- discover ---------- */
  .search{margin:6px 20px 10px;display:flex;align-items:center;gap:8px;background:var(--tint-2);border-radius:14px;padding:10px 14px;color:var(--mute);font-size:14px}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:14px}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:none;padding:8px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink)}
  .filters button.on{background:var(--turf);border-color:var(--turf);color:#fff}
  .hrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);text-align:left;width:100%}
  .hrow .thumb{width:76px;height:58px;border-radius:12px;overflow:hidden;flex:none}
  .hrow b{font-size:15px;display:block}
  .hrow small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  .hrow .oshi{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute);border:1.5px solid var(--line)}
  .hrow .oshi.on{color:#fff;background:var(--live);border-color:var(--live)}
  .hrow .oshi svg{width:20px;height:20px}

  /* ---------- mypage ---------- */
  .me{display:flex;align-items:center;gap:14px;padding:6px 20px 14px}
  .me .av{width:58px;height:58px;border-radius:50%;background:var(--turf);color:var(--gold);display:grid;place-items:center;font-size:22px;font-weight:800}
  .me b{font-size:18px;display:block}
  .me small{color:var(--mute);font-size:12.5px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
  .kpis div{background:var(--tint);border-radius:16px;padding:14px 16px}
  .kpis b{display:block;font-size:24px;font-weight:800;color:var(--turf)}
  .kpis span{font-size:12px;color:var(--mute)}
  .badges{display:flex;gap:10px;flex-wrap:wrap}
  .badge{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:600}
  .badge i{width:26px;height:26px;border-radius:50%;background:#F7EFD2;display:grid;place-items:center;color:#7A5E0F}
  .badge i svg{width:15px;height:15px}
  .badge.off{opacity:.45}

  /* ---------- owner ---------- */
  .ownerhead{background:var(--turf);color:#fff;padding:12px 20px 18px}
  .ownerhead small{font-size:11.5px;color:#BFD3C6}
  .ownerhead h1{font-size:20px;font-weight:800;margin-top:2px}
  .ownerhead .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .ownerhead .grid div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
  .ownerhead .grid b{display:block;font-size:22px;font-weight:800;color:var(--gold)}
  .ownerhead .grid span{font-size:11.5px;color:#BFD3C6}
  .flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;background:var(--tint);border-radius:14px;padding:12px 14px;font-size:12px}
  .flow b{display:block;font-size:15px;font-weight:800;color:var(--turf)}
  .flow span{color:var(--mute)}
  .flow .ar{color:var(--mute)}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quick button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
  .quick button b{display:block;font-size:13.5px}
  .quick button small{color:var(--mute);font-size:12px}
  .todo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#FFF6E5;font-size:12.5px;color:#7A5E0F;font-weight:600}

  /* ---------- sheet / modal ---------- */
  .backdrop{position:absolute;inset:0;background:rgba(15,25,20,.45);z-index:20;animation:fade .2s}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:var(--sheet-r) var(--sheet-r) 0 0;z-index:21;padding:8px 20px 28px;max-height:88%;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:#D8E0DA;margin:0 auto 14px}
  .sheet h2{font-size:19px;font-weight:800}
  .sheet .sub{color:var(--mute);font-size:13px;margin-top:4px;line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;background:#fff}
  .opt.on{border-color:var(--turf);background:var(--tint)}
  .opt .ic{width:42px;height:42px;border-radius:12px;background:var(--tint-2);display:grid;place-items:center;flex:none}
  .opt.on .ic{background:#fff}
  .opt .ic svg{width:26px;height:26px}
  .opt b{display:block;font-size:14.5px}
  .opt small{display:block;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.4}
  .opt .pr{margin-left:auto;font-weight:800;color:var(--turf);white-space:nowrap}
  .opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid #C9D3CC;flex:none;margin-left:6px;display:grid;place-items:center;color:#fff}
  .opt.on .chk{background:var(--turf);border-color:var(--turf)}
  .opt .chk svg{width:14px;height:14px}
  .field{margin:6px 0 14px}
  .field label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:600}
  .field textarea,.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;background:#fff;color:var(--ink);resize:none;outline:none}
  .field textarea:focus,.field input:focus{border-color:var(--turf-2)}
  .done{text-align:center;padding:14px 0 6px}
  .done .stamp{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--turf);animation:pop .5s cubic-bezier(.2,1.4,.3,1)}
  .done .stamp svg{width:54px;height:54px}
  .done h2{font-size:20px}
  .done p{color:var(--mute);font-size:13.5px;margin-top:8px;line-height:1.6}
  .floaters{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;overflow:visible}
  .floaters span{position:absolute;bottom:0;animation:rise 1.6s ease-out forwards;opacity:0}
  .floaters span svg{width:26px;height:26px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes rise{0%{transform:translateY(40px) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-120px) scale(1.1);opacity:0}}
  .toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--turf);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s;display:flex;align-items:center;gap:10px}
  .toast svg{width:18px;height:18px;flex:none;color:var(--gold)}
  .live-view{background:#0D0F0E;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/3;margin:12px 0}
  .live-view .chat{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-direction:column;gap:5px}
  .live-view .chat span{background:rgba(0,0,0,.5);color:#fff;font-size:11.5px;padding:5px 9px;border-radius:9px;align-self:flex-start}
  .live-view .chat span b{color:var(--gold);margin-right:6px}
  .live-view .cnt{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px}

  .froom{padding:6px 20px 16px;background:linear-gradient(180deg,var(--tint-2),#fff)}
  .froom .top{display:flex;justify-content:space-between;align-items:center}
  .froom .room{font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.04em}
  .favatar{border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
  .froom .line{font-size:15px;font-weight:700;color:var(--turf);margin-top:12px;line-height:1.5}
  .next{margin:0;background:var(--turf);color:#fff;border-radius:18px;padding:14px 16px}
  .next small{display:block;color:#BFD3C6;font-size:11.5px}
  .next b{display:block;font-size:16px;margin-top:2px}
  .story .it.now::before{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
  .story .it.now b{color:var(--turf)}
  .diary .it{padding:10px 0;border-top:1px solid var(--line)}
  .diary .it:first-child{border-top:0;padding-top:0}
  .diary small{color:var(--mute);font-size:11.5px}
  .diary p{font-size:13.5px;line-height:1.6;margin-top:3px}
  .learn{display:flex;flex-direction:column;gap:8px}
  .learn div{background:#F7EFD2;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;color:#5B4708}
  .fcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
  .fcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left}
  .fcard b{display:block;font-size:14.5px;margin-top:8px}
  .fcard small{display:block;font-size:11.5px;color:var(--mute);line-height:1.4;margin-top:2px}
  .fcard .bar{height:6px;margin:8px 0 6px;background:var(--tint)}
  .empty{padding:30px 20px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.6}
  .fee-note{font-size:11.5px;color:var(--mute);margin-top:10px;line-height:1.5}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  @media (max-width:900px){body{grid-template-columns:1fr}.panel{display:none}}
</style>
</head>

let S = freshState();

/* ---------------- helpers ---------------- */
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const yenMan = n => n >= 10000 ? (Math.round(n/1000)/10).toLocaleString('ja-JP', {maximumFractionDigits:1}) + '万円' : yen(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H = id => S.horses.find(h => h.id === id);
const EV = id => EVENTS.find(e => e.id === id);
const F = id => S.founders.find(f => f.id === id);
const isOshiF = id => S.user.oshiF.includes(id);
const favatar = (f, size=72, fs=30) => `<div class="favatar" style="width:${size}px;height:${size}px;font-size:${fs}px;background:${f.bg};color:${f.color}">${f.name[0]}</div>`;
const $ = s => document.querySelector(s);
let uid = 0; const gid = () => 'g' + (++uid);

function scene(coat, time, flip){
  const c = COATS[coat] || COATS.bay;
  if (time === 'stable') return stable(c);
  const T = TIMES[time] || TIMES.day, id = gid();
  const s = 0.27, w = 576*s, hx = 170, hy = 74;
  const tr = flip ? `translate(${hx+w},${hy}) scale(${-s},${s})` : `translate(${hx},${hy}) scale(${s})`;
  return `<svg class="scene" viewBox="0 0 390 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.sky[0]}"/><stop offset="1" stop-color="${T.sky[1]}"/></linearGradient></defs>
    <rect width="390" height="260" fill="url(#${id})"/>
    <circle cx="${T.sx}" cy="${T.sy}" r="${T.sr}" fill="${T.sun}" opacity=".95"/>
    <path d="M0 196C70 158 150 178 240 164S340 152 390 172V260H0Z" fill="${T.hill1}"/>
    <g transform="${tr}"><path d="${HORSE}" fill="${c}"/></g>
    <path d="M0 222C90 200 190 232 290 212S360 206 390 214V260H0Z" fill="${T.hill2}"/>
    <g stroke="${T.hill1}" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M40 226v-9M46 227v-7M300 216v-9M306 217v-7M200 236v-9M206 237v-7"/></g>
  </svg>`;
}
function stable(c){
  const id = gid();
  let planks = '';
  for (let i = 0; i < 9; i++) planks += `<rect x="${i*44}" y="0" width="42" height="260" fill="${i%2? '#6B4A2E':'#5E4028'}"/>`;
  return `<svg class="scene" viewBox="0 0 390 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="390" height="260" fill="#53381F"/>${planks}
    <rect x="250" y="34" width="96" height="76" rx="6" fill="#C9DDEA"/><rect x="250" y="34" width="96" height="76" rx="6" fill="none" stroke="#3B2915" stroke-width="6"/>
    <path d="M298 34v76M250 72h96" stroke="#3B2915" stroke-width="5"/>
    <rect x="0" y="200" width="390" height="60" fill="#C9A96A" opacity=".55"/>
    <g transform="translate(60,52) scale(0.34)"><path d="${HEAD}" fill="${c}"/></g>
  </svg>`;
}
function mediaOf(h, p){
  if (p.video && MEDIA[p.video]) return videoTag(p.video, p.pos||'50% 30%');
  if (p.img && MEDIA[p.img]) return `<img class="scene" src="${MEDIA[p.img]}" alt="" style="object-fit:cover;object-position:${p.pos||'50% 50%'}">`;
  return scene(h.coat, p.scene || 'day', p.flip);
}
function videoTag(key, pos){
  return `<video class="scene" autoplay muted loop playsinline poster="${MEDIA.still||''}" style="object-fit:cover;object-position:${pos}"><source src="${MEDIA[key]}" type="video/mp4">${MEDIA[key+'_webm']? `<source src="${MEDIA[key+'_webm']}" type="video/webm">`:''}</video>`;
}
function heroOf(h){
  if (h.hero && MEDIA[h.hero]) return `<img class="scene" src="${MEDIA[h.hero]}" alt="" style="object-fit:cover;object-position:${h.heroPos||'50% 50%'}">`;
  return scene(h.coat, h.id==='minato'?'morning':h.id==='yuzuki'?'dusk':'day', h.id==='yuzuki');
}
function avatar(h, extra='', size=48){
  if (h.photo && MEDIA[h.photo]) return `<div class="avatar ${extra}" style="width:${size}px;height:${size}px;background:url(${MEDIA[h.photo]}) center/cover"></div>`;
  const bg = {bay:'#EADFD5',darkbay:'#E6DBD1',chestnut:'#F3E1D2',grey:'#E9ECEE',black:'#E3E3E1'}[h.coat] || '#EADFD5';
  return `<div class="avatar ${extra}" style="background:${bg};width:${size}px;height:${size}px"><svg viewBox="0 0 512 512"><path d="${HEAD}" fill="${COATS[h.coat]}"/></svg></div>`;
}
function typeChip(h){ return `<span class="chip">${h.type}${h.disc? '・'+h.disc:''}</span>`; }
function stack(usage){
  const keys = Object.keys(usage);
  return `<div class="stack">${keys.map(k=>`<i style="width:${usage[k]}%;background:${CAT_COLORS[k]||'#999'}"></i>`).join('')}</div>
    <div class="legend">${keys.map(k=>`<div><i style="background:${CAT_COLORS[k]||'#999'}"></i>${k}<span>${usage[k]}%</span></div>`).join('')}</div>`;
}
function isSub(hid){ return !!S.user.tiers[hid]; }
function isOshi(hid){ return S.user.oshi.includes(hid); }

/* ---------------- render ---------------- */
function render(){
  const app = $('#app');
  const key = S.mode + ':' + (S.founderId ? 'f-'+S.founderId : (S.horseId || S.tab));
  if (S.mode === 'owner') app.innerHTML = viewOwner();
  else if (S.founderId) app.innerHTML = viewFounder(F(S.founderId));
  else if (S.horseId) app.innerHTML = viewHorse(H(S.horseId));
  else app.innerHTML = ({home:viewHome, discover:viewDiscover, calendar:viewCalendar, mypage:viewMe})[S.tab]();
  app.scrollTop = S.scroll[key] || 0;
  app.onscroll = () => { S.scroll[key] = app.scrollTop; };
  renderTabs(); renderModal(); renderSteps();
  $('#modeFan').classList.toggle('on', S.mode==='fan'); $('#modeOwner').classList.toggle('on', S.mode==='owner');
}
function renderTabs(){
  const tabs = [['home','ホーム',I.home],['discover','さがす',I.search],['calendar','予定',I.cal],['mypage','マイページ',I.user]];
  $('#tabbar').innerHTML = S.mode==='owner'

      ${locked? `<div class="lock">${I.lock}<b>サポーター限定の投稿</b><span>月額500円から、${h.name}の限定コンテンツが見られます</span><button class="btn sm" style="background:#fff;color:var(--turf)" data-act="sub" data-arg="${h.id}">サポーターになる</button></div>`:''}

/* discover */
function viewDiscover(){
  const fs = ['すべて','現役競走馬','馬術馬','引退馬','産駒','乗馬'];
  const list = S.horses.filter(h => (S.filter==='すべて' || h.type===S.filter) && (!S.query || (h.name+h.club+h.type+h.disc).includes(S.query)));
  return `
  <h1 class="page">さがす</h1>
  <div class="search">${I.search.replace('<svg','<svg style="width:18px;height:18px"')}<input id="q" placeholder="馬の名前、クラブ、厩舎" value="${esc(S.query)}" data-act="query"></div>
  <div class="filters">${fs.map(f=>`<button class="${S.filter===f?'on':''}" data-act="filter" data-arg="${f}">${f}</button>`).join('')}</div>
  ${list.map(h=>`<div class="hrow"><button class="row grow" data-act="horse" data-arg="${h.id}" style="text-align:left"><div class="thumb">${h.hero && MEDIA[h.hero] ? `<img class="scene" src="${MEDIA[h.hero]}" alt="" style="object-fit:cover;object-position:${h.heroPos||'50% 50%'}">` : scene(h.coat,'day',h.id==='yuzuki')}</div><div class="grow"><b>${h.name}</b><small>${h.type}・${h.disc} ・ ${h.club}</small><small class="num">サポーター ${h.supporters.toLocaleString()}人</small></div></button><button class="oshi ${isOshi(h.id)?'on':''}" data-act="oshi" data-arg="${h.id}" aria-label="推す">${isOshi(h.id)?I.heartF:I.heart}</button></div>`).join('')}
  ${list.length? '' : '<div class="empty">該当する馬がいません。条件を変えてみてください。</div>'}
  <div class="sec"><h3>経営者ルーム</h3><p class="mute" style="font-size:12.5px;line-height:1.5;margin-bottom:6px">この会社をつくる2人の成長の軌跡も、推せます。</p></div>
  ${S.founders.map(f=>`<div class="hrow"><button class="row grow" data-act="founder" data-arg="${f.id}" style="text-align:left">${favatar(f,48,22)}<div class="grow"><b>${f.name}　<span class="mute" style="font-weight:600;font-size:12px">${f.role}・${f.room}</span></b><small>${f.line}</small><small class="num">推している人 ${f.fans}人</small></div></button><button class="oshi ${isOshiF(f.id)?'on':''}" data-act="oshiF" data-arg="${f.id}" aria-label="推す">${isOshiF(f.id)?I.heartF:I.heart}</button></div>`).join('')}
  <div class="sec" style="padding-bottom:24px"><h3>近くで推せる</h3><p class="mute" style="font-size:13px;line-height:1.6">位置情報をオンにすると、乗馬クラブや牧場で公開している馬が地図で見られます。次の週末に会いに行ける馬から、推し活を始められます。</p><button class="btn ghost sm" style="margin-top:10px" data-act="toast" data-arg="デモでは位置情報は使いません">${I.pin}地図で見る</button></div>`;
}

/* calendar */
function viewCalendar(){
  return `
  <h1 class="page">予定</h1>
  <p class="lead">推し馬の試合・レース・面会デー。現地に行けない日は配信で。</p>
  <div class="wrap">${EVENTS.map(ev=>{
    const h = H(ev.horse); const booked = S.user.bookings.includes(ev.id);
    return `<div class="event"><div class="d"><span>${ev.m}</span><b>${ev.d}</b><span>${ev.w}</span></div><div>
      <button class="row" data-act="horse" data-arg="${h.id}" style="margin-bottom:4px">${avatar(h,'',26)}<b style="font-size:13.5px">${h.name}</b>${isOshi(h.id)? `<span class="chip gold">推し</span>`:''}</button>
      <h4>${ev.title}</h4><p>${ev.place}</p>
      <div class="ebtn">${booked? `<span class="chip">${I.check.replace('<svg','<svg style="width:12px;height:12px"')} 予約済み</span>` : `<button class="btn primary sm" data-act="book" data-arg="${ev.id}">${ev.tour.label}　${yen(ev.tour.price)}</button>`}${ev.stream? `<button class="btn ghost sm" data-act="toast" data-arg="配信のリマインダーを設定しました">配信を予約</button>`:''}</div>
    </div></div>`;}).join('')}</div>
  <div style="height:24px"></div>`;
}

/* mypage */
function viewMe(){
  const u = S.user;
  const subs = Object.keys(u.tiers);
  const agg = {}; let tot = 0;
  u.oshi.forEach(id => { const h = H(id); Object.entries(h.usage).forEach(([k,v]) => { agg[k]=(agg[k]||0)+v; tot+=v; }); });
  const norm = {}; Object.entries(agg).forEach(([k,v]) => norm[k] = Math.round(v/tot*100));
  const badges = [['初めてのギフト',I.carrot,true],['3頭を推し中',I.heartF,u.oshi.length>=3],['サポーター',I.star,subs.length>0],['現地で会った',I.pin,u.bookings.length>0],['産駒まで推した',I.trophy,u.oshi.includes('tsukinoko')],['海外の馬を推した',I.globe,false]];
  return `
  <h1 class="page">マイページ</h1>
  <div class="me"><div class="av">${u.name[0]}</div><div><b>${u.name}</b><small>推し活 2年目 ・ 2025年からUMAOSHI</small></div></div>
  <div class="kpis"><div><b class="num">${u.oshi.length}頭</b><span>推し馬</span></div><div><b class="num">${yen(u.total)}</b><span>支援累計（${u.gifts}回）</span></div></div>
  <div class="sec"><h3>推し馬</h3>
    ${u.oshi.map(id=>{const h=H(id); const t=TIERS.find(t=>t.id===u.tiers[id]);
      return `<div class="row" style="padding:8px 0"><button class="row grow" style="text-align:left" data-act="horse" data-arg="${id}">${avatar(h,'',44)}<div class="grow"><b style="font-size:14.5px">${h.name}</b><small style="display:block;font-size:12px;color:var(--mute)">${h.club}</small></div></button>${t? `<span class="chip gold">${t.name} ${yen(t.price)}/月</span>`:`<button class="btn soft sm" data-act="sub" data-arg="${id}">サポーターになる</button>`}</div>`;}).join('')}
  </div>
  <div class="sec"><h3>推している経営者</h3>${S.user.oshiF.length? S.user.oshiF.map(id=>{const f=F(id); const done=f.path.filter(x=>x.done).length; return `<button class="row" style="padding:8px 0;width:100%;text-align:left" data-act="founder" data-arg="${id}">${favatar(f,44,20)}<div class="grow"><b style="font-size:14.5px">${f.name}　<span class="mute" style="font-weight:600;font-size:12px">${f.role}</span></b><small style="display:block;font-size:12px;color:var(--mute)">軌跡 ${done}/${f.path.length} ・ 次：${(f.path.find(x=>!x.done)||{}).t||'—'}</small></div></button>`;}).join('') : `<p class="mute" style="font-size:13px">まだいません。「さがす」の経営者ルームから。</p>`}</div>
  <div class="sec"><h3>あなたの支援の使われ方</h3><div class="support" style="margin:0">${stack(norm)}<p class="fee-note">推し馬ごとの報告を合算しています。使途の明細は各馬のページの「使途レポート」から。</p></div></div>
  <div class="sec"><h3>予約中の予定</h3>${u.bookings.length? u.bookings.map(id=>{const ev=EV(id),h=H(ev.horse);return `<div class="event"><div class="d"><span>${ev.m}</span><b>${ev.d}</b><span>${ev.w}</span></div><div><h4>${h.name}｜${ev.title}</h4><p>${ev.place} ・ ${ev.tour.label}</p></div></div>`;}).join('') : `<p class="mute" style="font-size:13px;line-height:1.6">まだありません。「予定」から、推し馬に会いに行く日を選べます。</p>`}</div>
  <div class="sec" style="padding-bottom:28px"><h3>バッジ</h3><div class="badges">${badges.map(([n,ic,on])=>`<div class="badge ${on?'':'off'}"><i>${ic}</i>${n}</div>`).join('')}</div></div>`;
}

/* owner */
function viewOwner(){
  const o = OWNERS.kyoto;
  const hs = o.horses.map(H);
  const raised = hs.reduce((a,h)=>a+h.raised,0), fee = Math.round(raised*S.fee), net = raised-fee;
  const sup = hs.reduce((a,h)=>a+h.supporters,0);
  const reported = S.reports.filter(r=>o.horses.includes(r.h)).reduce((a,r)=>a+r.amt,0);
  const unreported = Math.max(0, net - reported);
  const reps = S.reports.filter(r=>o.horses.includes(r.h));
  return `
  <div class="ownerhead"><small>供給側アカウント（公認）</small><h1>${o.name}</h1>
    <div class="grid"><div><b class="num">${yen(net)}</b><span>今月の受取見込み（手数料差引後）</span></div><div><b class="num">${sup}人</b><span>サポーター合計（${hs.length}頭）</span></div></div>
  </div>
  <div class="sec"><h3>お金の流れ</h3><div class="flow"><div><b class="num">${yen(raised)}</b><span>ファンの支援</span></div><div class="ar">→</div><div><b class="num">−${yen(fee)}</b><span>手数料 ${Math.round(S.fee*100)}%</span></div><div class="ar">→</div><div><b class="num">${yen(net)}</b><span>受取額</span></div></div>
    ${unreported>0? `<div class="todo" style="margin-top:10px">${I.receipt.replace('<svg','<svg style="width:18px;height:18px"')}使途未報告 ${yen(unreported)}。報告するとファンのページに反映されます。</div>` : `<div class="todo" style="margin-top:10px;background:var(--tint);color:var(--turf)">${I.check.replace('<svg','<svg style="width:18px;height:18px"')}今月の受取額はすべて報告済みです。</div>`}
  </div>
  <div class="sec"><h3>やること</h3><div class="quick">
    <button data-act="compose"><b>${I.edit.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}投稿する</b><small>写真・動画とひとこと。1日1回が目安</small></button>
    <button data-act="report"><b>${I.receipt.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}使途を報告</b><small>レシートを登録すると自動で分類</small></button>
    <button data-act="toast" data-arg="配信を開始しました（デモ）"><b>${I.play.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}厩舎ライブを配信</b><small>厩舎カメラをそのまま配信</small></button>
    <button data-act="toast" data-arg="サポーター向けの月次レポートを送信しました（デモ）"><b>${I.star.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}月次レポート送信</b><small>使途と近況をまとめて自動生成</small></button>
  </div></div>
  <div class="sec"><h3>管理している馬</h3>${hs.map(h=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line)">${avatar(h,'',44)}<div class="grow"><b style="font-size:14.5px">${h.name}</b><small style="display:block;font-size:12px;color:var(--mute)">サポーター ${h.supporters}人 ・ 今月 ${yen(h.raised)} / ${yen(h.goal)}</small><div class="bar" style="margin:6px 0 0;height:6px;background:var(--tint)"><i style="width:${Math.min(100,Math.round(h.raised/h.goal*100))}%"></i></div></div></div>`).join('')}</div>
  <div class="sec" style="padding-bottom:28px"><h3>使途の報告履歴</h3><div class="ledger">${reps.map(r=>`<div class="li exp"><div class="who">${I.receipt.replace('<svg','<svg style="width:16px;height:16px"')}</div><div><b>${esc(r.label)}</b><small>${H(r.h).name} ・ ${r.d} ・ ${r.cat}</small></div><span class="amt num">−${yen(r.amt)}</span></div>`).join('')}</div></div>`;
}

/* ---------------- modal ---------------- */
function renderModal(){
  const m = S.modal, root = $('#modal');
  if (!m) { root.innerHTML = ''; return; }
  let body = '';
  const h = m.h ? H(m.h) : null;
  if (m.t === 'gift') {
    body = `<h2>${h.name}にギフトを贈る</h2><p class="sub">ギフトはそのまま${h.club}の飼養費になります。使途は1頭ごとに報告されます。</p>
      <div class="opts">${GIFTS.map(g=>`<button class="opt ${m.sel===g.id?'on':''}" data-act="pick" data-arg="${g.id}"><div class="ic">${g.icon}</div><div><b>${g.name}</b><small>${g.note}</small></div><span class="pr num">${yen(g.price)}</span><span class="chk">${m.sel===g.id?I.check:''}</span></button>`).join('')}</div>
      <div class="field"><label>メッセージ（厩舎に届きます）</label><input id="msg" placeholder="例：次の試合、応援しています" value="${esc(m.msg||'')}"></div>
      <button class="btn brown block" data-act="sendGift" data-arg="${h.id}">${I.carrot}${GIFTS.find(g=>g.id===m.sel).name}を贈る　${yen(GIFTS.find(g=>g.id===m.sel).price)}</button>`;
  } else if (m.t === 'giftDone') {
    const g = GIFTS.find(g=>g.id===m.g);
    body = `<div class="floaters">${[0,1,2,3,4].map(i=>`<span style="left:${18+i*16}%;animation-delay:${i*0.12}s">${g.icon}</span>`).join('')}</div>
      <div class="done"><div class="stamp">${g.icon}</div><h2>${h.name}に${g.name}を贈りました</h2><p>${yen(g.price)}のうち${yen(g.price*(1-S.fee))}が${h.club}へ。<br>厩舎から「ありがとう」の写真が届いたら通知します。</p></div>

      ${isOshi(h.id)? '' : `<button class="btn ghost block" style="margin-top:8px" data-act="oshi" data-arg="${h.id}">${I.heart}${h.name}を推しに登録する</button>`}`;
  } else if (m.t === 'sub') {
    body = `<h2>${h.name}のサポーターになる</h2><p class="sub">月額で継続的に支える会員。限定コンテンツと、毎月の使途レポートが届きます。いつでも解約できます。</p>
      <div class="opts">${TIERS.map(t=>`<button class="opt ${m.sel===t.id?'on':''}" data-act="pick" data-arg="${t.id}"><div><b>${t.name}</b><small>${t.perks}</small></div><span class="pr num">${yen(t.price)}<small style="display:inline;color:var(--mute);font-weight:600">/月</small></span><span class="chk">${m.sel===t.id?I.check:''}</span></button>`).join('')}</div>
      <button class="btn primary block" data-act="subscribe" data-arg="${h.id}">${I.heart}${TIERS.find(t=>t.id===m.sel).name}で支える　${yen(TIERS.find(t=>t.id===m.sel).price)}/月</button>`;
  } else if (m.t === 'subDone') {
    const t = TIERS.find(t=>t.id===m.tier);

      <div class="field"><label>ひとこと</label><textarea id="ptx" rows="3">今日は少し暑かったので、放牧を朝早めに切り上げました。水浴びが好きで、ホースを見ると自分から寄ってきます。</textarea></div>
      <label class="row" style="font-size:13px;margin-bottom:14px;gap:8px"><input type="checkbox" id="plock"> サポーター限定にする</label>
      <button class="btn primary block" data-act="publish">${I.edit}投稿する</button>`;
  } else if (m.t === 'report') {
    const presets = [['装蹄（4本）',18000,'装蹄'],['獣医 往診・治療',12000,'獣医・治療'],['飼料・牧草（追加分）',45000,'飼料・牧草'],['大会輸送（往復）',30000,'大会・輸送']];
    body = `<h2>使途を報告する</h2><p class="sub">レシートの写真を登録すると、金額と分類を自動で読み取ります。デモでは項目を選んで登録します。</p>
      <div class="field"><label>馬</label><select id="rh">${OWNERS.kyoto.horses.map(H).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div>
      <div class="opts">${presets.map((p,i)=>`<button class="opt ${m.sel===i?'on':''}" data-act="pick" data-arg="${i}"><div class="ic">${I.receipt}</div><div><b>${p[0]}</b><small>${p[2]}</small></div><span class="pr num">${yen(p[1])}</span><span class="chk">${m.sel===i?I.check:''}</span></button>`).join('')}</div>
      <button class="btn primary block" data-act="addReport">${I.receipt}この支出を報告する</button>`;
  }
  root.innerHTML = `<div class="backdrop" data-act="closeModal"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
}

/* ---------------- presenter steps ---------------- */
const STEPS = [
  ['タイムライン', '推し馬の日常が流れる。LIVE配信・限定投稿もここに', ()=>{S.mode='fan';S.tab='home';S.horseId=null;S.founderId=null;S.modal=null;}],
  ['推し馬ページ（ダノンイチロウ）', '一生を追える。支援の進み具合と使途を1頭単位で公開', ()=>{S.mode='fan';S.horseId='sora';S.founderId=null;S.modal=null;}],
  ['ギフトを贈る', '500円台から。贈った金額のうち手数料以外が厩舎へ', ()=>{S.mode='fan';S.horseId='sora';S.founderId=null;S.modal={t:'gift',h:'sora',sel:'carrot'};}],
  ['サポーターになる', '月額会員。限定投稿が開き、毎月の使途レポートが届く', ()=>{S.mode='fan';S.horseId='sora';S.founderId=null;S.modal={t:'sub',h:'sora',sel:'std'};}],
  ['使途レポート', '厩舎が登録した支出。透明性がこの事業の差別化', ()=>{S.mode='fan';S.horseId='sora';S.founderId=null;S.modal={t:'usage',h:'sora'};}],
  ['現地に会いに行く', '試合・レース・面会デーの予約。体験が単価の階段の上段', ()=>{S.mode='fan';S.horseId=null;S.founderId=null;S.tab='calendar';S.modal=null;}],
  ['供給側（馬術部）の画面', '受取額と手数料。ここから投稿・使途報告をするとファン側に反映', ()=>{S.mode='owner';S.modal=null;}],
  ['経営者ルーム（CEO・COO）', '2人の成長の軌跡を推せる。応援メッセージと少額ギフト', ()=>{S.mode='fan';S.horseId=null;S.founderId='era';S.modal=null;}],
  ['マイページ', '推し馬・推している経営者・支援累計・予約', ()=>{S.mode='fan';S.horseId=null;S.founderId=null;S.tab='mypage';S.modal=null;}],
];
function renderSteps(){
  $('#steps').innerHTML = STEPS.map((s,i)=>`<button class="step ${S.step===i+1?'on':''}" data-act="step" data-arg="${i+1}"><span class="n">${i+1}</span><div><b>${s[0]}</b><span>${s[1]}</span></div></button>`).join('');
}

/* ---------------- actions ---------------- */
let toastT;
function toast(msg){
  const t = $('#toast'); t.innerHTML = `<div class="toast">${I.check}<span>${esc(msg)}</span></div>`;
  clearTimeout(toastT); toastT = setTimeout(()=> t.innerHTML='', 2600);
}
function act(name, arg, el){
  switch(name){
    case 'tab': S.tab = arg; S.horseId = null; S.founderId = null; S.mode='fan'; break;
    case 'horse': S.horseId = arg; S.founderId = null; S.modal = null; S.scroll['fan:'+arg] = 0; break;
    case 'founder': S.founderId = arg; S.horseId = null; S.mode='fan'; S.modal = null; S.scroll['fan:f-'+arg] = 0; break;
    case 'back': if (S.founderId) S.founderId = null; else S.horseId = null; break;
    case 'oshiF': { const i = S.user.oshiF.indexOf(arg); const f = F(arg); if (i>=0){S.user.oshiF.splice(i,1); f.fans--;} else {S.user.oshiF.push(arg); f.fans++;} toast(i>=0? `${f.name}を推しから外しました` : `${f.name}を推しに登録しました`); break; }
    case 'cheer': S.modal = {t:'cheer', f:arg}; break;
    case 'giftF': S.modal = {t:'giftF', f:arg, sel:'coffee'}; break;
    case 'sendCheer': { const tx = ($('#cheerTx')||{}).value||''; if (!tx.trim()) { toast('メッセージを入力してください'); return; } const f = F(arg); (S.cheers[arg] ||= []).unshift({by:S.user.name, text:tx.trim(), when:'いま'}); f.cheers++; if (!isOshiF(arg)) { S.user.oshiF.push(arg); f.fans++; } S.modal = null; toast(`${f.name}に応援メッセージを送りました`); break; }
    case 'sendGiftF': { const g = FGIFTS.find(g=>g.id===S.modal.sel), f = F(arg); S.user.total += g.price; S.user.gifts++; if (!isOshiF(arg)) { S.user.oshiF.push(arg); f.fans++; } S.modal = {t:'giftFDone', f:arg, g:g.id}; break; }
    case 'mode': S.mode = arg; S.modal = null; S.founderId = null; if (arg==='owner') S.step = 7; break;
    case 'step': S.step = +arg; STEPS[S.step-1][2](); break;
    case 'reset': S = freshState(); toast('デモを最初の状態に戻しました'); break;
    case 'zoom': S.zoom = Math.max(.6, Math.min(1.3, S.zoom + (arg==='+'?.1:-.1))); fit(); return;
    case 'like': S.likes[arg] = !S.likes[arg]; S.likeCounts[arg] += S.likes[arg]?1:-1; break;
    case 'oshi': {
      const i = S.user.oshi.indexOf(arg);
      if (i>=0) S.user.oshi.splice(i,1); else S.user.oshi.push(arg);
      toast(i>=0? `${H(arg).name}を推しから外しました` : `${H(arg).name}を推しに登録しました`);
      if (S.modal && S.modal.t==='giftDone') S.modal = null;
      break; }
    case 'gift': S.modal = {t:'gift', h:arg, sel:'carrot'}; break;
    case 'sub': S.modal = {t:'sub', h:arg, sel:'std'}; break;
    case 'usage': S.modal = {t:'usage', h:arg}; break;
    case 'live': S.modal = {t:'live', h:arg}; break;
    case 'book': S.modal = {t:'book', ev:arg}; break;
    case 'compose': S.modal = {t:'compose'}; break;
    case 'report': S.modal = {t:'report', sel:0}; break;
    case 'pick': { const v = isNaN(+arg)? arg : +arg; S.modal.sel = v; if (S.modal.t==='gift') S.modal.msg = ($('#msg')||{}).value||''; break; }
    case 'closeModal': S.modal = null; break;
    case 'toast': toast(arg); return;
    case 'query': return; // handled on input
    case 'filter': S.filter = arg; break;
    case 'sendGift': {
      const g = GIFTS.find(g=>g.id===S.modal.sel), h = H(arg);
      h.raised += g.price; h.total += g.price; S.user.total += g.price; S.user.gifts++;
      S.ledger.unshift({k:'gift', h:h.id, by:S.user.name, label:g.name, amt:g.price, when:'いま'});
      S.modal = {t:'giftDone', h:h.id, g:g.id}; break; }
    case 'subscribe': {
      const t = TIERS.find(t=>t.id===S.modal.sel), h = H(arg);
      if (!S.user.tiers[h.id]) { h.supporters++; }
      S.user.tiers[h.id] = t.id; if (!isOshi(h.id)) S.user.oshi.push(h.id);
      h.raised += t.price; h.total += t.price; S.user.total += t.price;
      S.ledger.unshift({k:'sub', h:h.id, by:S.user.name, label:`月額サポーター（${t.name}）`, amt:t.price, when:'いま'});
      S.modal = {t:'subDone', h:h.id, tier:t.id}; break; }
    case 'confirmBook': {
      const ev = EV(arg); if (!S.user.bookings.includes(ev.id)) S.user.bookings.push(ev.id);
      const h = H(ev.horse); if (!isOshi(h.id)) S.user.oshi.push(h.id);
      S.user.total += ev.tour.price; S.modal = {t:'bookDone', ev:ev.id}; break; }
    case 'publish': {
      const hid = $('#ph').value, sc = $('#psc').value, tx = $('#ptx').value.trim(), lock = $('#plock').checked;
      if (!tx) { toast('ひとことを入力してください'); return; }
      const np = {id:'p'+Date.now(), h:hid, when:'いま', text:(lock?'サポーター限定：':'')+tx, locked:lock};
      if (sc.startsWith('img:')) np.img = sc.slice(4); else if (sc.startsWith('video:')) np.video = sc.slice(6); else np.scene = sc;
      S.posts.unshift(np);
      S.modal = null; toast(`${H(hid).name}の投稿を公開しました。ファン画面のタイムラインに表示されます`); break; }
    case 'addReport': {
      const presets = [['装蹄（4本）',18000,'装蹄'],['獣医 往診・治療',12000,'獣医・治療'],['飼料・牧草（追加分）',45000,'飼料・牧草'],['大会輸送（往復）',30000,'大会・輸送']];
      const p = presets[S.modal.sel], hid = $('#rh').value;
      S.reports.unshift({h:hid, d:'9/5', label:p[0], amt:p[1], cat:p[2]});
      S.modal = null; toast(`${H(hid).name}の使途を報告しました。ファンの使途レポートに反映されます`); break; }
  }
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'query') return;
  e.preventDefault(); act(el.dataset.act, el.dataset.arg, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.query = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos,pos); } }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.modal) { S.modal=null; render(); } });

/* fit phone to viewport */
function fit(){
  const stage = $('.stage'); const availH = stage.clientHeight - 40, availW = stage.clientWidth - 40;
  const sc = Math.min(availH/844, availW/390, 1.15) * S.zoom;
  $('#phone').style.transform = `scale(${sc})`;
}
window.addEventListener('resize', fit);
render(); fit();
</script>
</body>
</html>
